apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The `myriade` Secret is not part of the base: create it first (see
# secret.example.yaml) so credentials never live in this tree.
resources:
  - app.yaml
  - sandbox.yaml
  - networkpolicy.yaml
images:
  # Pin both to the same release.
  - name: myriadeai/myriade
    newTag: latest
  - name: myriadeai/sandbox
    newTag: latest
