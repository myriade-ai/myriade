# Copy, fill in, and apply before the base (kubectl apply -f my-secret.yaml).
# Never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: myriade
type: Opaque
stringData:
  DATABASE_URL: postgresql://myriade:CHANGE_ME@postgres:5432/myriade
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # Must never change once set, or stored credentials become unreadable.
  CREDENTIAL_ENCRYPTION_KEY: CHANGE_ME
  # Shared by the app and the sandbox; empty = code execution stays off.
  # openssl rand -hex 32
  SANDBOX_TOKEN: CHANGE_ME
  # Public URL of the instance (OAuth callbacks), e.g. https://myriade.example.com
  HOST: ""
  # Restrict sign-in to one organization (org_...).
  ORGANIZATION_ID: ""
